<!DOCTYPE html>
<html lang="en">
<head>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Ascend — Sign In</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#07070e;--card:#0e0e1a;--panel:#111120;--input:#14142a;
  --border:rgba(255,255,255,0.07);--border-y:rgba(255,200,0,0.2);
  --y:#FFCC00;--y2:#FF9500;--text:#f4f4ff;--t2:#a0a0c8;--t3:#5a5a8a;
  --red:#ef4444;--grn:#22c55e;
}
html,body{min-height:100%;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);display:flex;align-items:center;justify-content:center;min-height:100vh;}

/* bg glow */
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 50% at 50% 0%,rgba(255,200,0,0.07) 0%,transparent 70%);pointer-events:none;}

.wrap{width:100%;max-width:400px;padding:24px;}

.logo{display:flex;align-items:center;gap:10px;margin-bottom:40px;justify-content:center;}
.logo-mark{width:32px;height:32px;background:linear-gradient(135deg,#FFCC00,#FF9500);border-radius:8px;display:flex;align-items:center;justify-content:center;}
.logo-mark svg{width:16px;height:16px;fill:#000;}
.logo-text{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;color:var(--text);}

.card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:32px;}

.card-title{font-family:'Bebas Neue',sans-serif;font-size:28px;letter-spacing:2px;margin-bottom:4px;}
.card-sub{font-size:13px;color:var(--t2);margin-bottom:28px;font-weight:300;}

.field{margin-bottom:16px;}
.field label{display:block;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin-bottom:6px;}
.field input{width:100%;background:var(--input);border:1px solid var(--border);border-radius:10px;color:var(--text);font-family:inherit;font-size:14px;padding:12px 14px;outline:none;transition:border-color .2s;}
.field input:focus{border-color:rgba(255,200,0,0.35);}
.field input::placeholder{color:var(--t3);}

.btn-primary{width:100%;padding:13px;background:linear-gradient(135deg,#FFCC00,#FF9500);border:none;border-radius:11px;color:#000;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;letter-spacing:.03em;transition:all .15s;margin-top:4px;}
.btn-primary:hover{opacity:.88;transform:translateY(-1px);box-shadow:0 8px 24px rgba(255,180,0,0.25);}
.btn-primary:disabled{background:var(--input);color:var(--t3);cursor:not-allowed;transform:none;box-shadow:none;}

.divider{display:flex;align-items:center;gap:12px;margin:20px 0;}
.divider-line{flex:1;height:1px;background:var(--border);}
.divider-text{font-size:11px;color:var(--t3);font-weight:600;}

.btn-ghost{width:100%;padding:12px;background:transparent;border:1px solid var(--border);border-radius:11px;color:var(--t2);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn-ghost:hover{border-color:rgba(255,255,255,0.14);color:var(--text);}

.footer-link{text-align:center;margin-top:22px;font-size:13px;color:var(--t3);}
.footer-link a{color:var(--y);text-decoration:none;font-weight:700;}
.footer-link a:hover{opacity:.8;}

.msg{padding:11px 14px;border-radius:9px;font-size:13px;font-weight:600;margin-bottom:16px;display:none;}
.msg.error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);color:#fca5a5;}
.msg.success{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.2);color:#86efac;}

.forgot{text-align:right;margin-top:-10px;margin-bottom:16px;}
.forgot a{font-size:12px;color:var(--t3);text-decoration:none;transition:color .15s;}
.forgot a:hover{color:var(--y);}

@keyframes spin{to{transform:rotate(360deg)}}
.spinner{width:16px;height:16px;border:2px solid rgba(0,0,0,0.2);border-top-color:#000;border-radius:50%;animation:spin .7s linear infinite;}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24"><path d="M12 2L4 20h16L12 2z"/></svg>
    </div>
    <div class="logo-text">ASCEND</div>
  </div>

  <div class="card">
    <div class="card-title">Welcome back</div>
    <div class="card-sub">Sign in to your account</div>

    <div class="msg" id="msgBox"></div>

    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" autocomplete="email"/>
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password"/>
    </div>
    <div class="forgot"><a href="#" onclick="forgotPassword()">Forgot password?</a></div>

    <button class="btn-primary" id="loginBtn" onclick="doLogin()">Sign in</button>

    <div class="divider">
      <div class="divider-line"></div>
      <div class="divider-text">OR</div>
      <div class="divider-line"></div>
    </div>

    <button class="btn-ghost" onclick="doGoogle()">
      <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continue with Google
    </button>
  </div>

  <div class="footer-link">
    Don't have an account? <a href="/signup">Sign up</a>
  </div>
</div>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
const sb = createClient(
  'https://asvpzsnncbxkpycsgfnj.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFzdnB6c25uY2J4a3B5Y3NnZm5qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU3OTMwOTksImV4cCI6MjA5MTM2OTA5OX0.S1poy30uv9R6_xG8d-wi27eIgeXbvlVIaLbgAljM4j0'
);

function showMsg(text, type){
  const el = document.getElementById('msgBox');
  el.textContent = text;
  el.className = 'msg ' + type;
  el.style.display = 'block';
}

function setLoading(loading){
  const btn = document.getElementById('loginBtn');
  btn.disabled = loading;
  btn.innerHTML = loading ? '<div class="spinner"></div>' : 'Sign in';
}

window.doLogin = async function(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  if(!email || !password){ showMsg('Please fill in all fields.', 'error'); return; }
  setLoading(true);
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ showMsg(error.message, 'error'); setLoading(false); return; }
  localStorage.setItem('ascend_user_id', data.user.id);
  localStorage.setItem('ascend_session', JSON.stringify(data.session));
  window.location.href = '/app';
};

window.doGoogle = async function(){
  await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.origin + '/app' } });
};

window.forgotPassword = async function(){
  const email = document.getElementById('email').value.trim();
  if(!email){ showMsg('Enter your email above first.', 'error'); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/app' });
  if(error){ showMsg(error.message, 'error'); return; }
  showMsg('Check your email for a reset link.', 'success');
};

// Enter key
document.addEventListener('keydown', e => { if(e.key === 'Enter') window.doLogin(); });

// Already logged in?
const { data } = await sb.auth.getSession();
if(data.session) window.location.href = '/app';
</script>
</body>
</html>
